services:
  shadowbroker:
    build:
      context: ./external/Shadowbroker-backend
    ports:
      - "8000:8000"
    env_file: ./external/Shadowbroker-backend/.env

  mirofish:
    build:
      context: ./external/mirofish-backend
    command: uv run python run.py
    ports:
      - "5001:5001"
    env_file: ./external/mirofish-backend/.env

  gateway:
    build: ./backend
    ports:
      - "8090:4000"
    env_file: .env
    environment:
      - SHADOWBROKER_URL=http://shadowbroker:8000
      - MIROFISH_URL=http://mirofish:5001
    depends_on:
      - shadowbroker
      - mirofish
