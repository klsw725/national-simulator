services:
  dozerdb:
    image: graphstack/dozerdb:5.26.3.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/mirofish
      - NEO4J_PLUGINS=["apoc", "n10s"]
      - dbms.security.procedures.unrestricted=apoc.*,n10s.*
      - dbms.security.procedures.allowlist=apoc.*,n10s.*
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
    volumes:
      - dozerdb-data:/data
      - dozerdb-logs:/logs
    restart: unless-stopped

  shadowbroker:
    build:
      context: ./external/Shadowbroker-backend
    ports:
      - "8000:8000"
    env_file: ./external/Shadowbroker-backend/.env

  mirofish:
    build:
      context: ./external/mirofish-backend
    command: uv run python run.py
    ports:
      - "5001:5001"
    env_file: ./external/mirofish-backend/.env
    environment:
      - USE_LOCAL_GRAPH=true
      - DOZERDB_URI=bolt://dozerdb:7687
    depends_on:
      - dozerdb

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: osint_simulator
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint -d osint_simulator"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      - SHADOWBROKER_URL=http://shadowbroker:8000
      - MIROFISH_URL=http://mirofish:5001
      - DATABASE_URL=postgresql://osint:osint_dev@postgres:5432/osint_simulator
    depends_on:
      shadowbroker:
        condition: service_started
      mirofish:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8090:3000"
    environment:
      - GATEWAY_URL=http://gateway:4000
    depends_on:
      - gateway

volumes:
  dozerdb-data:
  dozerdb-logs:
  pgdata:
